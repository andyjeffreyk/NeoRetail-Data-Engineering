
name: neoretail

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    container_name: neoretail-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_HOST: 0.0.0.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
